<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>FDIC Safeguard — Fraud Victim Assistance Program</title>
  <style>
    :root {
      --navy: #0b1f3a;
      --navy-dark: #071426;
      --navy-light: #15325b;
      --gold: #c9a227;
      --gold-hover: #b08d1f;
      --gold-dark: #8b7332;
      --purple: #4a2c6b;
      --purple-hover: #392054;
      --bg-page: #f2f4f8;
      --card-bg: #ffffff;
      --text-main: #1b2432;
      --text-muted: #5a6577;
      --border-color: #d8dee9;
      --danger: #b42318;
      --danger-bg: #fef3f2;
      --success: #067647;
      --success-bg: #ecfdf3;
      --warning: #b54708;
      --warning-bg: #fffaeb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Screen Visibility */
    #login-screen { display: flex; flex-direction: column; min-height: 100vh; }
    #admin-screen, #dashboard-screen { display: none; flex-direction: column; min-height: 100vh; }

    /* Shared Top Header */
    .login-topbar {
      background-color: var(--navy);
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 3px solid var(--gold);
      gap: 10px;
    }

    .swoosh-svg {
      width: 200px;
      height: 42px;
      display: block;
    }

    /* Buttons */
    .gold-pill-btn {
      background-color: var(--gold);
      color: #0b1f3a;
      font-weight: 700;
      font-size: 16px;
      border: none;
      border-radius: 999px;
      padding: 13px 28px;
      cursor: pointer;
      width: 100%;
      transition: background 0.15s ease;
    }
    .gold-pill-btn:hover, .gold-pill-btn:active { background-color: var(--gold-hover); }

    .purple-pill-btn {
      background-color: var(--purple);
      color: #ffffff;
      font-weight: 700;
      font-size: 15px;
      border: none;
      border-radius: 999px;
      padding: 12px 24px;
      cursor: pointer;
    }
    .purple-pill-btn:hover, .purple-pill-btn:active { background-color: var(--purple-hover); }

    .signout-pill-btn {
      background: transparent;
      color: #ffffff;
      border: 1px solid rgba(255,255,255,0.45);
      border-radius: 999px;
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .signout-pill-btn:hover, .signout-pill-btn:active {
      background: rgba(255,255,255,0.12);
    }

    /* SCREEN 1: LOGIN SCREEN */
    .login-main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 28px 16px;
    }

    .login-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 440px;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(11, 31, 58, 0.08);
      border: 1px solid var(--border-color);
      padding: 28px 22px;
    }

    .login-card h1 {
      font-size: 26px;
      color: var(--navy);
      margin-bottom: 4px;
    }

    .login-sub {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .notice-box {
      background-color: #f8f6ef;
      border-left: 4px solid var(--gold);
      padding: 12px 14px;
      border-radius: 4px;
      margin-bottom: 22px;
    }

    .notice-title {
      font-size: 12px;
      font-weight: 800;
      color: var(--navy);
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .notice-body {
      font-size: 12.5px;
      color: #334155;
      line-height: 1.45;
    }

    .field-group {
      margin-bottom: 16px;
    }

    .field-group label {
      display: block;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--navy);
      margin-bottom: 6px;
    }

    .rect-input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #b8c2d1;
      border-radius: 4px;
      font-size: 16px;
      color: var(--text-main);
    }
    .rect-input:focus {
      outline: none;
      border-color: var(--navy);
      box-shadow: 0 0 0 2px rgba(11, 31, 58, 0.15);
    }

    .pass-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .pass-wrap .rect-input { padding-right: 60px; }

    .eye-btn {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: var(--navy-light);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      padding: 6px;
    }

    #error-msg {
      color: var(--danger);
      background: var(--danger-bg);
      border: 1px solid #fecdca;
      padding: 10px 12px;
      border-radius: 4px;
      font-size: 13px;
      margin-bottom: 14px;
      display: none;
    }

    .options-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      margin-bottom: 20px;
    }

    .remember-label {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-main);
      cursor: pointer;
    }

    .gold-text-link {
      color: var(--gold-dark);
      font-weight: 600;
      text-decoration: none;
    }
    .gold-text-link:hover { text-decoration: underline; }

    .card-bottom-note {
      margin-top: 22px;
      padding-top: 16px;
      border-top: 1px solid var(--border-color);
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .staff-link {
      display: inline-block;
      margin-top: 10px;
      background: none;
      border: none;
      color: var(--navy-light);
      font-weight: 700;
      font-size: 13px;
      text-decoration: underline;
      cursor: pointer;
      padding: 4px 0;
    }

    /* SCREEN 2: ADMIN SCREEN */
    .admin-main {
      flex: 1;
      max-width: 960px;
      width: 100%;
      margin: 22px auto;
      padding: 0 16px;
    }

    .admin-panel-card {
      background: #ffffff;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      padding: 24px 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.05);
    }

    .admin-panel-card h2 {
      color: var(--navy);
      margin-bottom: 6px;
      font-size: 21px;
    }

    .admin-desc {
      font-size: 13.5px;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .admin-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 14px;
      margin-bottom: 22px;
    }

    .admin-group label {
      display: block;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 5px;
    }

    .admin-input {
      width: 100%;
      padding: 10px 11px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      font-size: 16px;
    }

    .admin-btn-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .admin-btn-row .gold-pill-btn { width: auto; flex: 1; min-width: 180px; }
    .admin-btn-row .purple-pill-btn { flex: 1; min-width: 160px; }

    #admin-feedback {
      margin-top: 14px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--success);
    }

    /* SCREEN 3: DASHBOARD SCREEN */
    .util-bar {
      background-color: var(--navy-dark);
      color: #cbd5e1;
      font-size: 11.5px;
      padding: 8px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .util-links {
      display: flex;
      gap: 14px;
    }
    .util-links a {
      color: #cbd5e1;
      text-decoration: none;
    }
    .util-links a:hover { color: #ffffff; text-decoration: underline; }

    .dash-header {
      background-color: var(--navy);
      color: #ffffff;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .user-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-name-badge {
      font-size: 13.5px;
      font-weight: 600;
      color: #f8fafc;
    }

    .dash-nav {
      background-color: #ffffff;
      border-bottom: 1px solid var(--border-color);
      padding: 0 20px;
      display: flex;
      gap: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .nav-tab {
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      padding: 14px 4px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
    }
    .nav-tab.active, .nav-tab:hover {
      color: var(--navy);
      border-bottom-color: var(--gold);
    }

    .dash-container {
      max-width: 1180px;
      width: 100%;
      margin: 22px auto;
      padding: 0 16px;
      flex: 1;
    }

    .greeting-banner {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .greeting-banner h1 {
      font-size: 22px;
      color: var(--navy);
    }

    .last-signon {
      font-size: 12.5px;
      color: var(--text-muted);
    }

    .hold-pill {
      background-color: var(--warning-bg);
      color: var(--warning);
      border: 1px solid #fedf89;
      font-size: 11.5px;
      font-weight: 800;
      padding: 5px 11px;
      border-radius: 999px;
      letter-spacing: 0.4px;
    }

    .dash-grid {
      display: grid;
      grid-template-columns: 1.55fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }

    @media (max-width: 880px) {
Use code with caution.
.dash-grid { grid-template-columns: 1fr; }
}
.card-box {
background: #ffffff;
border: 1px solid var(--border-color);
border-radius: 8px;
padding: 20px;
box-shadow: 0 2px 8px rgba(11, 31, 58, 0.04);
margin-bottom: 20px;
}
.card-header-row {
display: flex;
justify-content: space-between;
align-items: flex-start;
margin-bottom: 12px;
gap: 8px;
}
.card-title {
font-size: 17px;
font-weight: 700;
color: var(--navy);
}
.card-subtitle {
font-size: 13px;
color: var(--text-muted);
margin-bottom: 16px;
}
.balance-big {
font-size: 32px;
font-weight: 800;
color: var(--navy);
margin: 6px 0 4px;
}
.balance-avail {
font-size: 13.5px;
color: var(--text-muted);
margin-bottom: 16px;
}
.acct-meta-strip {
display: grid;
grid-template-columns: repeat(3, 1fr);
gap: 10px;
background: #f8fafc;
border: 1px solid #e2e8f0;
border-radius: 6px;
padding: 12px;
font-size: 12.5px;
}
@media (max-width: 520px) {
.acct-meta-strip { grid-template-columns: 1fr; }
}
.meta-label {
font-size: 10.5px;
text-transform: uppercase;
color: var(--text-muted);
font-weight: 700;
}
.meta-val {
font-weight: 700;
color: var(--navy);
margin-top: 2px;
word-break: break-all;
}
/* Activity List */
.tx-row {
display: flex;
justify-content: space-between;
align-items: center;
padding: 13px 0;
border-bottom: 1px solid #edf2f7;
gap: 12px;
}
.tx-row:last-child { border-bottom: none; }
.tx-left {
display: flex;
align-items: center;
gap: 10px;
}
.tx-badge-in {
background: #e0f2fe;
color: #0369a1;
font-weight: 800;
font-size: 11px;
padding: 6px 8px;
border-radius: 6px;
flex-shrink: 0;
}
.tx-title {
font-weight: 700;
font-size: 14px;
color: var(--navy);
}
.tx-ref {
font-size: 11.5px;
color: var(--text-muted);
word-break: break-word;
}
.tx-right {
text-align: right;
flex-shrink: 0;
}
.tx-amt {
font-weight: 700;
font-size: 14.5px;
color: var(--success);
}
.tx-status {
font-size: 11.5px;
font-weight: 700;
color: var(--warning);
}
/* Move Money Grid */
.quick-actions-grid {
display: grid;
grid-template-columns: repeat(3, 1fr);
gap: 10px;
}
.action-tile {
background: #f8fafc;
border: 1px solid #cbd5e1;
border-radius: 6px;
padding: 14px 8px;
text-align: center;
cursor: pointer;
transition: all 0.15s ease;
}
.action-tile:hover, .action-tile:active {
background: #eef2f6;
border-color: var(--navy);
}
.action-icon {
font-size: 20px;
display: block;
margin-bottom: 6px;
color: var(--navy);
}
.action-label {
font-size: 12.5px;
font-weight: 700;
color: var(--navy);
}
/* Secure Note Box */
.note-textarea {
width: 100%;
min-height: 84px;
padding: 10px;
border: 1px solid #cbd5e1;
border-radius: 6px;
font-size: 16px;
margin: 12px 0;
resize: vertical;
}
.sent-note-item {
background: #f1f5f9;
border-left: 3px solid var(--navy);
padding: 8px 12px;
border-radius: 4px;
font-size: 13px;
margin-bottom: 8px;
}
/* Case Status Section */
.section-divider {
border-top: 2px solid var(--border-color);
padding-top: 24px;
margin-top: 10px;
}
.breadcrumb {
font-size: 12.5px;
color: var(--text-muted);
margin-bottom: 6px;
}
.detail-table {
width: 100%;
border-collapse: collapse;
margin: 14px 0;
font-size: 13.5px;
}
.detail-table td {
padding: 9px 4px;
border-bottom: 1px solid #edf2f7;
}
.detail-table td:first-child {
color: var(--text-muted);
width: 44%;
}
.detail-table td:last-child {
font-weight: 700;
color: var(--navy);
text-align: right;
word-break: break-word;
}
.disclaimer-mini {
background: #f8fafc;
border: 1px solid #e2e8f0;
padding: 12px;
border-radius: 6px;
font-size: 12px;
color: var(--text-muted);
line-height: 1.5;
}
.confidential-banner {
background: var(--navy);
color: #ffffff;
padding: 12px 14px;
border-radius: 6px;
margin: 14px 0;
}
.confidential-banner strong {
color: var(--gold);
font-size: 12px;
letter-spacing: 0.5px;
display: block;
margin-bottom: 3px;
}
.confidential-banner p {
font-size: 13px;
color: #e2e8f0;
}
.progress-bar-wrap {
background: #e2e8f0;
height: 10px;
border-radius: 999px;
overflow: hidden;
margin: 8px 0 14px;
}
.progress-bar-fill {
background: var(--gold);
height: 100%;
width: 10%;
transition: width 0.3s ease;
}
.specialist-card {
display: flex;
align-items: center;
gap: 14px;
background: #f8fafc;
border: 1px solid #cbd5e1;
padding: 14px;
border-radius: 8px;
margin-top: 12px;
}
.specialist-avatar {
width: 44px;
height: 44px;
border-radius: 50%;
background: var(--navy);
color: var(--gold);
font-weight: 800;
font-size: 18px;
display: flex;
align-items: center;
justify-content: center;
flex-shrink: 0;
}
.log-entry {
border-left: 3px solid var(--gold);
padding-left: 14px;
margin-bottom: 18px;
}
.log-time {
font-size: 12px;
font-weight: 700;
color: var(--text-muted);
}
.log-title {
font-size: 14.5px;
font-weight: 700;
color: var(--navy);
margin: 2px 0 4px;
}
.log-body {
font-size: 13px;
color: #334155;
line-height: 1.55;
}
/* SHARED FOOTER */
.site-footer {
background-color: var(--navy-dark);
color: #cbd5e1;
padding: 32px 20px 28px;
margin-top: auto;
border-top: 3px solid var(--gold);
}
.footer-inner {
max-width: 1180px;
margin: 0 auto;
}
.footer-cols {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
gap: 22px;
margin-bottom: 24px;
}
.footer-col h4 {
color: #ffffff;
font-size: 13px;
letter-spacing: 0.5px;
margin-bottom: 10px;
}
.footer-col p {
font-size: 12.5px;
margin-bottom: 8px;
color: #94a3b8;
}
.footer-col a {
display: block;
color: #cbd5e1;
text-decoration: none;
font-size: 12.5px;
margin-bottom: 6px;
}
.footer-col a:hover {
color: var(--gold);
text-decoration: underline;
}
.program-badge {
display: inline-block;
background: rgba(201, 162, 39, 0.15);
border: 1px solid var(--gold);
color: var(--gold);
font-size: 11.5px;
font-weight: 800;
padding: 5px 12px;
border-radius: 4px;
margin-bottom: 10px;
}
.ehl-row {
font-size: 12px;
font-weight: 700;
color: #ffffff;
margin-bottom: 16px;
display: flex;
align-items: center;
gap: 6px;
}
.legal-copy {
border-top: 1px solid rgba(255,255,255,0.12);
padding-top: 16px;
font-size: 11.5px;
color: #94a3b8;
line-height: 1.55;
}
.legal-copy p {
margin-bottom: 10px;
}

}
